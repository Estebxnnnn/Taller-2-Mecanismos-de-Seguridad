<style>
 :root{--bg:#0f172a;--panel:#ffffff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--accent:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
 *{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
 body{margin:0;display:grid;grid-template-columns:340px 1fr;height:100vh;color:var(--ink);background:#f1f5f9}
 #side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
 header{background:var(--bg);color:#fff;padding:14px 16px}
 header h1{font-size:17px;margin:0}header small{color:#94a3b8;font-size:11px}
 .consent{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:11px;padding:8px 10px;margin:10px;border-radius:8px;line-height:1.4}
 .sec{padding:10px 14px;border-bottom:1px solid var(--line)}
 .sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 8px}
 .dev{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
 .dev:hover{background:#f8fafc;border-color:var(--line)}
 .dev.active{background:#eff6ff;border-color:#bfdbfe}
 .dot{width:12px;height:12px;border-radius:50%;flex:none}
 .dev .nm{font-weight:600;font-size:14px}.dev .mt{font-size:11px;color:var(--mut)}
 .badge{font-size:10px;padding:2px 7px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:600}
 .stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
 .stat b{font-variant-numeric:tabular-nums}
 .alert{font-size:12px;padding:6px 8px;border-left:3px solid var(--line);margin-bottom:6px;background:#f8fafc;border-radius:0 6px 6px 0}
 .alert.enter{border-color:var(--green)}.alert.exit{border-color:var(--red)}
 #map{height:100vh}
 .pill{position:absolute;z-index:500;top:12px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
 #play{display:flex;gap:8px;align-items:center;margin-top:6px}
 #play button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600}
 input[type=range]{width:100%}
 .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-top:4px}
</style>
</head>

<script>
const COLORS=['#dc2626','#2563eb','#7c3aed','#059669'];
const map=L.map('map',{zoomControl:true}).setView([4.618,-74.073],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
  attribution:'&copy; OpenStreetMap'}).addTo(map);
document.getElementById('pill').textContent='Panel del propietario · '+Object.keys(DATA.names).length+' dispositivos con consentimiento';
// geocercas
DATA.geofences.forEach(g=>{L.circle([g.lat,g.lon],{radius:g.radius_m,color:'#0e7490',weight:1.5,dashArray:'5',
  fillColor:'#0891b2',fillOpacity:.12}).addTo(map).bindPopup('<b>'+g.name+'</b><br>radio '+g.radius_m+' m');});
const ids=Object.keys(DATA.names), layers={}, markers={}, N={};
ids.forEach((did,i)=>{
  const c=COLORS[i%COLORS.length], pts=DATA.tracks[did].map(p=>[p.lat,p.lon]);
  layers[did]=L.polyline(pts,{color:c,weight:4,opacity:.85}).addTo(map);
  const last=DATA.tracks[did][DATA.tracks[did].length-1];
  markers[did]=L.circleMarker([last.lat,last.lon],{radius:8,color:'#fff',weight:2,fillColor:c,fillOpacity:1})
    .addTo(map).bindPopup('<b>'+DATA.names[did]+'</b><br>'+last.ts.replace('T',' ').slice(0,19)+'<br>🔋 '+last.battery+'%');
  N[did]=DATA.tracks[did].length;
});
map.fitBounds(L.featureGroup(Object.values(layers)).getBounds().pad(.15));
// panel dispositivos
const devEl=document.getElementById('devs');
DATA.devices.forEach((d,i)=>{const c=COLORS[i%COLORS.length];
  const el=document.createElement('div');el.className='dev';el.dataset.id=d.device_id;
  el.innerHTML=`<span class="dot" style="background:${c}"></span><div style="flex:1">
    <div class="nm">${d.display_name}</div><div class="mt">${d.phone} · 🔋 ${d.last?d.last.battery:'–'}%</div></div>
    <span class="badge">${d.consent_state}</span>`;
  el.onclick=()=>{document.querySelectorAll('.dev').forEach(x=>x.classList.remove('active'));el.classList.add('active');
    map.fitBounds(layers[d.device_id].getBounds().pad(.2));markers[d.device_id].openPopup();showStats(d.device_id,d.display_name);};
  devEl.appendChild(el);});
// estadísticas
function showStats(did,name){const s=DATA.stats[did],el=document.getElementById('stats');
  const rows=[['Dispositivo',name],['Puntos',s.points],['Distancia',s.distance_km+' km'],
    ['Duración',s.duration_min+' min'],['Vel. media',s.avg_speed_kmh+' km/h'],['Vel. máx',s.max_speed_kmh+' km/h'],
    ['Batería',s.battery_start+'% → '+s.battery_end+'%']];
  Object.entries(s.minutes_in_geofence||{}).forEach(([k,v])=>rows.push(['Tiempo en '+k,v+' min']));
  el.innerHTML=rows.map(r=>`<div class="stat"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');}
showStats(ids[0],DATA.names[ids[0]]);document.querySelector('.dev').classList.add('active');
// geocercas panel
document.getElementById('fences').innerHTML=DATA.geofences.map(g=>
  `<div class="stat"><span>📍 ${g.name}</span><b>r=${g.radius_m} m</b></div>`).join('');
// alertas
document.getElementById('alerts').innerHTML=DATA.alerts.map(a=>{
  const kind=a.kind.includes('enter')?'enter':'exit', nm=DATA.names[a.device_id]||a.device_id;
  return `<div class="alert ${kind}"><b>${kind==='enter'?'Entró a':'Salió de'} ${a.gname}</b><br>
    ${nm} · ${a.ts.replace('T',' ').slice(0,19)}</div>`;}).join('') || '<div class="mt">Sin alertas</div>';
// reproducción temporal
let playing=false,t=1,maxN=Math.max(...Object.values(N)),timer=null;
const slider=document.getElementById('slider');slider.max=maxN;
function render(k){ids.forEach((did,i)=>{const tr=DATA.tracks[did].slice(0,Math.min(k,N[did]));
  if(tr.length){layers[did].setLatLngs(tr.map(p=>[p.lat,p.lon]));
    const l=tr[tr.length-1];markers[did].setLatLng([l.lat,l.lon]);}});
  const any=DATA.tracks[ids[0]][Math.min(k,N[ids[0]])-1];
  document.getElementById('clock').textContent=any?any.ts.replace('T',' ').slice(11,19):'';}
slider.oninput=()=>{t=+slider.value;render(t);};
document.getElementById('pp').onclick=function(){playing=!playing;this.textContent=playing?'⏸ Pausar':'▶ Reproducir';
  if(playing){timer=setInterval(()=>{t=t>=maxN?1:t+1;slider.value=t;render(t);if(t>=maxN){playing=false;this.textContent='▶ Reproducir';clearInterval(timer);}},120);}
  else clearInterval(timer);};
render(maxN);
</script>
